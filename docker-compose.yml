version: '3.8'

services:
  node0:
    build: .
    container_name: bft-node0
    command: ["0", "--listen"]
    environment:
      - BFT_DOCKER=1
    ports:
      - "5000:5000"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./logs:/app/logs
      - ./rocksdb:/app/rocksdb
    networks:
      - bft-net

  node1:
    build: .
    container_name: bft-node1
    command: ["1", "--listen"]
    environment:
      - BFT_DOCKER=1
    ports:
      - "5001:5001"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./logs:/app/logs
      - ./rocksdb:/app/rocksdb
    networks:
      - bft-net

  node2:
    build: .
    container_name: bft-node2
    command: ["2", "--listen"]
    environment:
      - BFT_DOCKER=1
    ports:
      - "5002:5002"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./logs:/app/logs
      - ./rocksdb:/app/rocksdb
    networks:
      - bft-net

  node3:
    build: .
    container_name: bft-node3
    command: ["3", "--listen"]
    environment:
      - BFT_DOCKER=1
    ports:
      - "5003:5003"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./logs:/app/logs
      - ./rocksdb:/app/rocksdb
    networks:
      - bft-net

networks:
  bft-net:
    driver: bridge
